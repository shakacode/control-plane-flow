name: Wait for Control Plane workload health
description: >-
  Polls Control Plane until the latest workload version is ready, then checks
  the standard workload endpoint and ready location endpoints with curl. Exits
  success when the HTTP response status is in the accepted list. Fails non-zero
  (and reports `healthy=false`) once retries are exhausted.

inputs:
  workload_name:
    description: Workload to query (e.g. `rails`).
    required: true
  app_name:
    description: GVC / Control Plane app name the workload belongs to.
    required: true
  org:
    description: Control Plane organization.
    required: true
  max_retries:
    description: Number of attempts before giving up.
    required: false
    default: "24"
  interval_seconds:
    description: Seconds to sleep between attempts.
    required: false
    default: "15"
  accepted_statuses:
    description: >-
      Space-separated list of HTTP status codes considered healthy. The default
      `200 301 302` accepts redirects because curl is invoked without `-L`, so a
      root path that auth-redirects looks like a redirect, not a failure.
    required: false
    default: "200 301 302"
  curl_max_time:
    description: Per-request curl timeout, seconds.
    required: false
    default: "10"

outputs:
  healthy:
    description: '"true" once a healthy response was observed; "false" otherwise.'
    value: ${{ steps.poll.outputs.healthy }}
  endpoint:
    description: The workload or location endpoint that returned an accepted status.
    value: ${{ steps.poll.outputs.endpoint }}

runs:
  using: composite
  steps:
    - name: Poll workload endpoint
      id: poll
      shell: bash
      env:
        CPFLOW_WORKLOAD_NAME: ${{ inputs.workload_name }}
        CPFLOW_APP_NAME: ${{ inputs.app_name }}
        CPFLOW_ORG: ${{ inputs.org }}
        CPFLOW_MAX_RETRIES: ${{ inputs.max_retries }}
        CPFLOW_INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
        CPFLOW_ACCEPTED_STATUSES: ${{ inputs.accepted_statuses }}
        CPFLOW_CURL_MAX_TIME: ${{ inputs.curl_max_time }}
      run: |
        set -euo pipefail

        read -r -a accepted_statuses <<< "${CPFLOW_ACCEPTED_STATUSES}"

        check_endpoint() {
          local endpoint="$1"
          local endpoint_type="$2"
          local http_status

          http_status="$(curl -s -o /dev/null -w '%{http_code}' --max-time "${CPFLOW_CURL_MAX_TIME}" "${endpoint}" 2>/dev/null || true)"
          http_status="${http_status:-000}"
          echo "${endpoint_type}: ${endpoint}, HTTP status: ${http_status}"

          for accepted in "${accepted_statuses[@]}"; do
            if [[ "${http_status}" == "${accepted}" ]]; then
              {
                echo "healthy=true"
                echo "endpoint=${endpoint}"
              } >> "$GITHUB_OUTPUT"
              return 0
            fi
          done

          return 1
        }

        for attempt in $(seq 1 "${CPFLOW_MAX_RETRIES}"); do
          echo "Health check attempt ${attempt}/${CPFLOW_MAX_RETRIES}"

          if ! workload_json="$(cpln workload get "${CPFLOW_WORKLOAD_NAME}" --gvc "${CPFLOW_APP_NAME}" --org "${CPFLOW_ORG}" -o json 2>&1)"; then
            echo "::error::Workload '${CPFLOW_WORKLOAD_NAME}' not found in GVC '${CPFLOW_APP_NAME}'. Set PRIMARY_WORKLOAD to the correct workload name." >&2
            printf '%s\n' "${workload_json}" >&2
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          workload_ready="$(echo "${workload_json}" | jq -r '.status.ready // false')"
          latest_ready="$(echo "${workload_json}" | jq -r '.status.readyLatest // false')"
          readiness_status="$(echo "${workload_json}" | jq -r '.health.readiness // "unknown"')"
          workload_endpoint="$(echo "${workload_json}" | jq -r '.status.endpoint // empty')"

          if [[ "${workload_ready}" != "true" || "${latest_ready}" != "true" ]]; then
            echo "Workload status: ready=${workload_ready}, readyLatest=${latest_ready}, readiness=${readiness_status}; waiting for latest deployment."
          else
            if [[ -n "${workload_endpoint}" ]] && check_endpoint "${workload_endpoint}" "Workload endpoint"; then
              exit 0
            fi

            location_endpoint_count=0
            if deployments_json="$(cpln workload get-deployments "${CPFLOW_WORKLOAD_NAME}" --gvc "${CPFLOW_APP_NAME}" --org "${CPFLOW_ORG}" -o json 2>/dev/null)"; then
              while IFS= read -r location_endpoint; do
                location_endpoint_count=$((location_endpoint_count + 1))
                if [[ -n "${location_endpoint}" &&
                      "${location_endpoint}" != "${workload_endpoint}" ]] &&
                  check_endpoint "${location_endpoint}" "Location endpoint"; then
                  exit 0
                fi
              done < <(
                printf '%s\n' "${deployments_json}" |
                  jq -r '.items[]? | select(.status.ready == true and (.status.deploying // false) == false) | .status.endpoint // empty' |
                  awk '!seen[$0]++'
              )
            else
              echo "::warning::Could not list location endpoints for workload '${CPFLOW_WORKLOAD_NAME}'; retrying."
            fi

            if [[ -z "${workload_endpoint}" && "${location_endpoint_count}" -eq 0 ]]; then
              echo "Workload '${CPFLOW_WORKLOAD_NAME}' has no endpoint yet; waiting for one to be assigned."
            fi
          fi

          if [[ "${attempt}" -lt "${CPFLOW_MAX_RETRIES}" ]]; then
            sleep "${CPFLOW_INTERVAL_SECONDS}"
          fi
        done

        echo "healthy=false" >> "$GITHUB_OUTPUT"
        exit 1
