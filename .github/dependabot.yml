version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/cpflow-setup-environment"
    schedule:
      interval: weekly
    # Keep SHA-pinned actions current in one grouped weekly version PR.
    open-pull-requests-limit: 1
    groups:
      action-updates:
        applies-to: version-updates
        patterns:
          - "*"
