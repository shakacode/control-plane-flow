version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/cpflow-setup-environment"
    schedule:
      interval: weekly
    # Disable version PRs; SHA-pinned actions require manual security checks.
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
