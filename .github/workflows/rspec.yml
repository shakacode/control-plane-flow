name: RSpec

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'COMM-LICENSE.txt'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'COMM-LICENSE.txt'
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  rspec-fast:
    name: RSpec (Fast)
    uses: ./.github/workflows/rspec-shared.yml
    if: github.event_name != 'schedule'
    with:
      os_version: ubuntu-latest
      ruby_version: "3.2"
      test_tag: ~slow
    secrets: inherit

  ruby-compatibility:
    name: Ruby ${{ matrix.ruby-version }} compatibility
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.3"
          - "3.4"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run credential-free offline suite
        env:
          CPLN_ORG: ""
        run: |
          bundle exec rspec \
            spec/cpflow_spec.rb \
            spec/github_workflows_spec.rb \
            spec/patches \
            spec/support_specs \
            spec/core/controlplane_api_direct_spec.rb \
            spec/core/controlplane_api_spec.rb \
            spec/core/doctor_service_spec.rb \
            spec/core/github_flow_readiness/checks_spec.rb \
            spec/core/github_flow_readiness_service_spec.rb \
            spec/core/helpers_spec.rb \
            spec/core/repo_introspection_spec.rb \
            spec/core/shell_spec.rb \
            spec/rakelib/create_release_spec.rb \
            spec/command/no_command_spec.rb \
            spec/command/staging_branch_validation_spec.rb \
            spec/command/test_spec.rb \
            spec/command/update_github_actions_spec.rb \
            spec/command/version_spec.rb \
            spec/command/deploy_image_unit_spec.rb \
            spec/command/promote_app_from_upstream_unit_spec.rb
      - name: Analyze code
        run: bundle exec rubocop

  rspec-slow:
    name: RSpec (Slow)
    uses: ./.github/workflows/rspec-shared.yml
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    with:
      os_version: ubuntu-latest
      ruby_version: "3.2"
      test_tag: slow
      uses_shared_org: true
    secrets: inherit

  report-scheduled-slow-suite-failure:
    name: Report scheduled slow suite failure
    needs: rspec-slow
    if: ${{ always() && github.event_name == 'schedule' && needs.rspec-slow.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update the scheduled slow suite failure issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const title = "Scheduled slow suite failing";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled RSpec slow suite failed.",
              "",
              `Latest failed run: ${runUrl}`,
              "",
              "Resolve this issue after a scheduled slow-suite run succeeds."
            ].join("\n");
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            let existingIssue;

            for (let page = 1; !existingIssue; page += 1) {
              const { data: search } = await github.rest.search.issuesAndPullRequests({
                q: query,
                per_page: 100,
                page
              });
              existingIssue = search.items.find((issue) => issue.title === title);

              if (search.items.length < 100 || page * 100 >= search.total_count) break;
            }

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body
              });
              core.info(`Updated issue #${existingIssue.number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created issue #${issue.number}.`);
            }
