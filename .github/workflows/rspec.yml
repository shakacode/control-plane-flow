name: RSpec

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'COMM-LICENSE.txt'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'COMM-LICENSE.txt'
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  rspec-fast:
    name: RSpec (Fast)
    uses: ./.github/workflows/rspec-shared.yml
    if: github.event_name != 'schedule'
    # Fast runs use isolated random app suffixes, so only serialize the same PR
    # or ref. Keep the default single pending slot so obsolete heads are
    # replaced instead of accumulating behind the current run.
    concurrency:
      group: cpln-shared-org-${{ vars.CPLN_ORG || github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    with:
      os_version: ubuntu-latest
      ruby_version: "3.2"
      test_tag: ~slow
    secrets:
      CPLN_TOKEN: ${{ secrets.CPLN_TOKEN }}

  rspec-slow:
    name: RSpec (Slow)
    uses: ./.github/workflows/rspec-shared.yml
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # Slow and Specific runs can mutate the shared domain. Retain every waiter
    # in one repository-wide queue instead of replacing an earlier pending run.
    concurrency:
      group: cpln-shared-org-${{ vars.CPLN_ORG || github.repository }}-shared-org
      cancel-in-progress: false
      queue: max
    with:
      os_version: ubuntu-latest
      ruby_version: "3.2"
      test_tag: slow
    secrets:
      CPLN_TOKEN: ${{ secrets.CPLN_TOKEN }}

  report-scheduled-slow-suite-failure:
    name: Report scheduled slow suite failure
    needs: rspec-slow
    if: ${{ always() && github.event_name == 'schedule' && needs.rspec-slow.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update the scheduled slow suite failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Scheduled slow suite failing";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled RSpec slow suite failed.",
              "",
              `Latest failed run: ${runUrl}`,
              "",
              "Resolve this issue after a scheduled slow-suite run succeeds."
            ].join("\n");
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            let existingIssue;

            for (let page = 1; !existingIssue; page += 1) {
              const { data: search } = await github.rest.search.issuesAndPullRequests({
                q: query,
                per_page: 100,
                page
              });
              existingIssue = search.items.find((issue) => issue.title === title);

              if (search.items.length < 100 || page * 100 >= search.total_count) break;
            }

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body
              });
              core.info(`Updated issue #${existingIssue.number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created issue #${issue.number}.`);
            }
