---
# Trusted policy retained for tools that have not migrated to Shaka's typed
# repository contract. This file is not part of the Shaka seam. Read every
# value from a trusted base ref established before reading candidate content.
# Missing, unreadable, or invalid values must fail closed.
untrusted_contributor_intake:
  trusted_github_host: github.com
  trusted_github_scheme: https
  trusted_github_repo: shakacode/control-plane-flow
repo_prefix: CPF
coordination_backend: "private shakacode/agent-coordination (claims/heartbeats namespaced by full repo name)"
