---
version: 1
base_branch: main
review:
  required: none
  # Local reviewer preference; independent from hosted review workflows.
  reviewers:
    - provider: anthropic
      model_family: claude
    - provider: openai
      model_family: codex
merge:
  preference: ask
branches:
  name: "{login}-{host}/{issue}-{description}"
recovery:
  workspace_path: false
